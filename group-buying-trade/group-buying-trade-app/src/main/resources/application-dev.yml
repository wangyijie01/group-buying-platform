server:
  port: ${TRADE_SERVER_PORT:8070}

app:
  config:
    api-version: v1
    cross-origin: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
    group-buying-market:
      api-url: ${MARKET_API_URL:http://127.0.0.1:8091}
      notify-url: ${MARKET_NOTIFY_URL:http://127.0.0.1:8070/api/v1/alipay/group_buy_notify}
      source: ${MARKET_SOURCE:s01}
      chanel: ${MARKET_CHANNEL:c01}

thread:
  pool:
    executor:
      config:
        core-pool-size: ${TRADE_EXECUTOR_CORE_SIZE:10}
        max-pool-size: ${TRADE_EXECUTOR_MAX_SIZE:20}
        keep-alive-time: 5000
        block-queue-size: 1000
        policy: CallerRunsPolicy

spring:
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me}
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:13306}/${TRADE_DB_NAME:group-buying-trade}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Trade_HikariCP
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 20
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:10}
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-attempts: 3
          max-interval: 10s
    template:
      mandatory: true
    config:
      dead-letter:
        exchange: s_pay_mall_dlx
      producer:
        topic_order_pay_success:
          exchange: s_pay_mall_exchange
          routing_key: topic.order_pay_success
          queue: s_pay_mall_queue_2_order_pay_success
      consumer:
        topic_team_success:
          exchange: group_buy_market_exchange
          routing_key: topic.team_success
          queue: s_pay_mall_queue_2_topic_team_success
        topic_team_refund:
          exchange: group_buy_market_exchange
          routing_key: topic.team_refund
          queue: s_pay_mall_queue_2_topic_team_refund
        topic_order_pay_success:
          exchange: s_pay_mall_exchange
          routing_key: topic.order_pay_success
          queue: s_pay_mall_queue_2_order_pay_success

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

weixin:
  config:
    originalid: ${WEIXIN_ORIGINAL_ID:replace-me}
    token: ${WEIXIN_TOKEN:replace-me}
    app-id: ${WEIXIN_APP_ID:replace-me}
    app-secret: ${WEIXIN_APP_SECRET:replace-me}
    template_id: ${WEIXIN_TEMPLATE_ID:replace-me}

alipay:
  enabled: ${ALIPAY_ENABLED:false}
  app_id: ${ALIPAY_APP_ID:replace-me}
  merchant_private_key: ${ALIPAY_MERCHANT_PRIVATE_KEY:replace-me}
  alipay_public_key: ${ALIPAY_PUBLIC_KEY:replace-me}
  notify_url: ${ALIPAY_NOTIFY_URL:http://127.0.0.1:8070/api/v1/alipay/alipay_notify_url}
  return_url: ${ALIPAY_RETURN_URL:http://127.0.0.1:8070}
  gatewayUrl: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}

sc:
  group:
    buy:
      market:
        source: ${MARKET_SOURCE:s01}
        chanel: ${MARKET_CHANNEL:c01}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: group-buying-trade
    description: 社区生鲜商城支付交易服务

logging:
  level:
    root: info
  config: classpath:logback-spring.xml
